# An example configuration (docs/reference/configuration.md). Made-up names only.
# Secrets are named by the environment variable that holds them, never written here.

repositories:
  - name: shop-backend
    path: /srv/code/shop-backend         # a checkout or a bare repository; relative paths start at this file's folder
    description: The shop's backend — orders, payments, the public API.
    exclude: ["**/fixtures/**", "*.pem", "*.env"]

    guidance:                            # for agents, beside the repository's own AGENTS.md, rules and skills
      text: Amounts are cents. Answer them in euros with two decimals.
      from: [{repo: acme-rules, path: shop-backend}]   # a folder of another repository: its AGENTS.md, rules, skills

  - name: handbook
    path: /srv/code/handbook
    include: ["docs/**", "README.md"]    # only these are ever served; a folder added later stays out

  - name: acme-rules
    path: /srv/code/acme-rules
    listed: false                        # a source of guidance only; agents don't see it

  - url: https://gitlab.example.com/acme/shop-frontend.git   # mirrored; named shop-frontend from its url
    token_env: GITLAB_TOKEN              # the variable holding a read-only token — never the token
    token_user: oauth2                   # GitLab's; GitHub needs none
    refs: [main, "release/*"]            # the branches and tags kept; the default branch always
    exclude: ["*.pem", "*.env"]          # their contents are never fetched

  - url: git@git.example.com:acme/tools.git   # over ssh: the server account's own keys

mirrors:
  folder: /var/lib/repo-reader-mcp       # default: ~/.cache/repo-reader-mcp
  every_minutes: 10                      # 0: at start only

guidance:                                # for every repository
  text: Say which commit you read.

limits:
  answer_characters: 40000               # clients cut long answers; a cut answer says so

